<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &bull; Personal Notes</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* High priority styles to guarantee perfect input boxes */
    .login-input {
      width: 100% !important;
      display: block !important;
      height: 46px !important;
      padding: 0 1rem !important;
      border: 1.5px solid #cbd5e1 !important;
      border-radius: 8px !important;
      font-size: 0.95rem !important;
      font-family: inherit !important;
      color: #0f172a !important;
      background-color: #ffffff !important;
      outline: none !important;
      transition: all 0.15s ease !important;
      box-sizing: border-box !important;
    }
    .login-input:focus {
      border-color: #2563eb !important;
      box-shadow: 0 0 0 3.5px rgba(37, 99, 235, 0.15) !important;
    }
    .password-input-wrapper {
      position: relative !important;
      width: 100% !important;
    }
    .password-input-wrapper .login-input {
      padding-right: 2.75rem !important;
    }
    .btn-eye {
      position: absolute !important;
      right: 0.75rem !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      background: none !important;
      border: none !important;
      color: #94a3b8 !important;
      cursor: pointer !important;
      padding: 0.35rem !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .btn-eye:hover {
      color: #334155 !important;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1>Personal Notes</h1>
        <p>Private &amp; Secure Access</p>
      </div>

      <div id="login-error" class="alert-box error" style="display: none;"></div>

      <form id="login-form" method="POST" action="/api/login">
        <div class="form-group">
          <label for="email">Login ID</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="login-input"
            value="123@gmail.com" 
            placeholder="name@example.com" 
            required 
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="login-input"
              value="123" 
              placeholder="Enter password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" id="toggle-password" class="btn-eye" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="height: 46px; font-size: 0.95rem; margin-top: 1.25rem;">
          <span>Sign In</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="login-footer">
        <span>Protected personal environment &bull; lalpesh.com</span>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('login-error');
    const submitBtn = document.getElementById('login-submit-btn');
    const togglePass = document.getElementById('toggle-password');
    const passInput = document.getElementById('password');

    togglePass.addEventListener('click', () => {
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Signing In...</span>';
      
      const email = document.getElementById('email').value.trim();
      const password = passInput.value.trim();

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const contentType = res.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          const data = await res.json();
          if (res.ok && data.success) {
            window.location.href = '/';
            return;
          } else {
            errorBox.textContent = data.error || 'Invalid login ID or password.';
            errorBox.style.display = 'block';
          }
        } else {
          // Fallback: if server redirected directly
          if (res.ok) {
            window.location.href = '/';
            return;
          }
          errorBox.textContent = 'Server response error. Please try again.';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.textContent = 'Connection error: ' + (err.message || 'Please check your connection and try again.');
        errorBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <span>Sign In</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        `;
      }
    });
  </script>
</body>
</html>
